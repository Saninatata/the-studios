<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Studios — Design Authority</title>
<meta name="description" content="A studio that builds itself, one decision at a time.">
<meta name="theme-color" content="#0f0b08">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
@property --r{syntax:"<percentage>";inherits:true;initial-value:-12%}
:root{--ink:#0f0b08;--paper:#fbf8ee;--p6:rgba(251,248,238,.6);--p25:rgba(251,248,238,.25);--e:cubic-bezier(.22,1,.36,1);--pad:24px}
*{box-sizing:border-box;margin:0}
html{background:var(--ink);scrollbar-width:none}html::-webkit-scrollbar{display:none}
body{color:var(--paper);font:300 12px/1.2 Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.d{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;letter-spacing:-.03em}
button,a{all:unset;cursor:pointer}
#gl{position:fixed;inset:0;width:100%;height:100%}
.scroll{height:800vh}
.ui{position:fixed;inset:0;pointer-events:none}
.ui>*{pointer-events:none}.ui button,.ui a{pointer-events:auto}
header{position:absolute;top:0;left:0;right:0;padding:var(--pad);display:flex;justify-content:space-between;align-items:flex-start}
.logo{position:absolute;left:50%;transform:translateX(-50%);font-size:24px;line-height:.9;text-align:center}
.snd{display:inline-flex;gap:8px;align-items:center;transition:opacity .2s}.snd:hover{opacity:.6}
.snd i{display:inline-block;width:1px;height:12px;background:var(--paper);margin-right:1px;animation:b 1.1s ease-in-out infinite alternate}
.snd i:nth-child(2){animation-delay:-.4s;height:8px}.snd i:nth-child(3){animation-delay:-.8s;height:14px}
.snd[aria-pressed=false] i{animation:none;height:2px}
@keyframes b{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
.sc{position:absolute;left:var(--pad);bottom:150px;opacity:0;visibility:hidden;transition:opacity .6s var(--e),visibility 0s .6s}
.sc.on{opacity:1;visibility:visible;transition-delay:.15s,0s}
.sc .l{color:var(--p6);margin-bottom:20px}
.sc h2{font-size:clamp(44px,8vw,96px);line-height:.8;font-weight:500;text-transform:uppercase}
.sc p{position:fixed;right:var(--pad);top:50%;transform:translateY(-50%);width:244px;font-size:13px;line-height:1.25}
.sc.fin{bottom:var(--pad)}
.rail{position:absolute;left:var(--pad);bottom:var(--pad);display:flex;gap:24px;opacity:0;transition:opacity .6s}
.rail.on{opacity:1}
.rail button{width:150px;display:flex;flex-direction:column;gap:14px;color:var(--p6)}
.rail button.cur{color:var(--paper)}
.rail u{display:block;height:1px;background:var(--p25);position:relative;text-decoration:none}
.rail u b{position:absolute;inset:0;background:var(--paper);transform-origin:left;transform:scaleX(var(--p,0))}
.card{position:absolute;right:var(--pad);top:92px;background:var(--paper);color:var(--ink);padding:12px;opacity:0;transform:translateY(-8px);transition:.6s var(--e)}
.card.on{opacity:1;transform:none}.card img{display:block;width:220px;height:150px;object-fit:cover}.card span{display:block;margin-top:8px;font-size:13px;text-transform:none}
.hint{position:absolute;right:var(--pad);bottom:var(--pad);color:var(--p6);text-align:right;transition:opacity .4s}
.btns{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:16px;opacity:0;visibility:hidden;transition:opacity .6s var(--e),visibility 0s .6s}
.btns.on{opacity:1;visibility:visible;transition-delay:0s}
.btn{border:1px solid var(--p6);padding:20px 32px;font-size:22px;white-space:nowrap;transition:.3s}
.btn:hover{background:var(--paper);color:var(--ink)}
#veil{position:fixed;inset:0;z-index:29;background:var(--ink);pointer-events:none;--r:-12%;-webkit-mask-image:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 14%));mask-image:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 14%))}
#veil.open{--r:112%;transition:--r 1.9s cubic-bezier(.65,0,.35,1)}
#pre{position:fixed;inset:0;z-index:30;background:var(--ink);transition:opacity .5s}
#pre.done{opacity:0;pointer-events:none}
#pre>p{position:absolute;left:50%;transform:translateX(-50%);color:var(--p6);white-space:nowrap}
#pre .top{top:var(--pad)}#pre .cnt{bottom:38px}#pre .st{bottom:var(--pad)}
.fr{position:absolute;left:50%;top:50%;width:min(428px,86vw);height:240px;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:24px;line-height:.9;text-align:center;text-transform:uppercase}
.fr::before{content:"";position:absolute;inset:0;border:1px solid var(--p6);--m:6%;-webkit-mask-image:radial-gradient(var(--m) var(--m) at 0 0,#000 55%,transparent 100%);mask-image:radial-gradient(var(--m) var(--m) at 0 0,#000 55%,transparent 100%)}
#pre.ready .fr,#pre.ready .cnt,#pre.ready .st{opacity:0;transition:opacity .5s}
#ent{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:24px}
#pre.ready #ent{display:flex}
#pre .hn{bottom:var(--pad);display:none}#pre.ready .hn{display:block}
@media(max-width:700px){.sc p{position:static;transform:none;width:auto;max-width:280px;margin-top:16px}.rail button{width:70px}.card{display:none}.rail{right:var(--pad)}}
@media(prefers-reduced-motion:reduce){.sc,.card{transition:none}}
</style></head>
<body class="lock">
<canvas id="gl"></canvas><div class="scroll"></div>
<div class="ui">
 <header><span>About</span><a class="logo d" href="#" id="logo">The<br>Studios</a>
  <button class="snd" data-snd aria-pressed="true"><span><i></i><i></i><i></i></span><span class="sl">Sound [on]</span></button></header>
 <div id="titles"></div>
 <div class="card" id="card"><img id="cimg" alt=""><span id="ccap"></span></div>
 <div class="btns" id="btns"><a class="btn d" href="mailto:hello@thestudios.site">Start a project</a><button class="btn d" id="again">Watch again</button></div>
 <nav class="rail" id="rail"></nav>
 <p class="hint" id="hint">Scroll to<br>build</p>
</div>
<div id="veil"></div>
<div id="pre"><p class="top">Design Authority</p>
 <div class="fr d" id="fr">The<br>Studios</div>
 <div id="ent"><button class="btn d" id="enter">Enter</button><button class="snd" data-snd aria-pressed="true"><span><i></i><i></i><i></i></span><span class="sl">Sound [on]</span></button></div>
 <p class="cnt" id="cnt">000</p><p class="st" id="st">Ground</p><p class="hn">Best on a large screen. Scroll slowly.</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Copy: swap in your own. Ranges are scroll progress 0…1 ---------- */
const SCENES=[
 {id:'hero',r:[0,.05],l:'Design Authority',t:'The Studios',b:'A studio that builds itself, one decision at a time.'},
 {id:'c1',r:[.07,.25],l:'I/IV — Ground',t:'Foundation',b:'Before a pixel moves, the ground is laid: research, positioning, a point of view.'},
 {id:'c2',r:[.29,.47],l:'II/IV — Structure',t:'Structure',b:'Systems, grids and type. The load-bearing decisions nobody sees and everyone feels.'},
 {id:'c3',r:[.51,.77],l:'III/IV — Craft',t:'The work',b:'Each piece is hung only when it is ready to be judged.'},
 {id:'c4',r:[.79,.9],l:'IV/IV — Light',t:'Light',b:'Motion and detail. The last ten percent that makes it feel inevitable.'},
 {id:'fin',r:[.94,1.1],l:'The Studios',t:'Every brand<br>is built.',b:'Let us build yours.',fin:1}];
const WORK=[ // placeholders: replace names, captions and palettes with real projects
 {n:'Renderit',c:'01 — Renderit, AI rendering',p:['#1d3b5a','#e8b86a']},
 {n:'SocialMind',c:'02 — SocialMind, agent dashboard',p:['#5a1d2a','#f2d8b0']},
 {n:'Your project',c:'03 — Your project here',p:['#1f4a3a','#d9e8c4']}];
const RAIL=[['I','Ground',.07,.27],['II','Structure',.29,.49],['III','Craft',.51,.78],['IV','Light',.79,.93]];

const $=s=>document.querySelector(s),clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t;
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* ---------- Scene ---------- */
const R=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(0x0f0b08);S.fog=new THREE.FogExp2(0x0f0b08,.03);
const cam=new THREE.PerspectiveCamera(55,1,.1,200);
S.add(new THREE.HemisphereLight(0xffe9cf,0x1a120c,.35));
const key=new THREE.DirectionalLight(0xffefdc,.6);key.position.set(-10,16,12);S.add(key);
const stone=new THREE.MeshStandardMaterial({color:0xece4d6,roughness:.5}),dark=new THREE.MeshStandardMaterial({color:0x1b1714,roughness:.22,metalness:.25}),gold=new THREE.MeshStandardMaterial({color:0xb39562,roughness:.45,metalness:.7});
let sd=11;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
const parts=[];
function add(m,x,y,z,a,b,ox,oy,oz){m.userData={t:[x,y,z],a,b,o:[ox,oy,oz],r:[rnd()*2-1,rnd()*2-1,rnd()*2-1]};S.add(m);parts.push(m);return m}
const bx=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
for(let i=-3;i<=3;i++)for(let j=0;j<=8;j++){const a=.05+.17*rnd()+j*.004;add(bx(2.85,.2,2.85,(i+j)%2?dark:stone),i*3,-.1,3-j*3,a,a+.09,rnd()*6-3,-8-rnd()*10,rnd()*6-3)}
for(const s of[-1,1])for(let k=0;k<6;k++){const a=.28+k*.02;
 const c=add(new THREE.Mesh(new THREE.CylinderGeometry(.38,.45,6,24),stone),s*8,3,-k*5,a,a+.08,0,-9,0);
 add(bx(1.3,.35,1.3,gold),s*8,6.2,-k*5,a+.05,a+.12,0,10,0)}
for(const s of[-1,1])add(bx(.6,.5,30,stone),s*8,6.6,-12.5,.42,.5,0,12,0);
for(let k=0;k<6;k++)add(bx(16.6,.35,.5,stone),0,6.9,-k*5,.44+k*.01,.52+k*.01,0,12,0);
add(bx(26,10,.4,dark),0,5,-27,.4,.5,0,-9,0);
const frames=WORK.map((w,i)=>{
 const cv=document.createElement('canvas');cv.width=640;cv.height=440;const x=cv.getContext('2d');
 const g=x.createLinearGradient(0,0,640,440);g.addColorStop(0,w.p[0]);g.addColorStop(1,'#0f0b08');x.fillStyle=g;x.fillRect(0,0,640,440);
 x.fillStyle=w.p[1];x.globalAlpha=.9;x.beginPath();x.arc(470,150,90,0,7);x.fill();x.globalAlpha=.35;x.fillRect(60,250,360,6);x.fillRect(60,280,240,6);
 x.globalAlpha=1;x.font='500 64px Georgia,serif';x.fillText(w.n,60,200);w.img=cv.toDataURL();
 const t=new THREE.CanvasTexture(cv);const m=new THREE.MeshBasicMaterial({map:t,color:0x000000});
 const X=(i-1)*8.2,a=.52+i*.06;
 add(bx(6.9,4.8,.3,gold),X,4.6,-26.7,a,a+.08,0,0,14);
 const p=add(new THREE.Mesh(new THREE.PlaneGeometry(6.4,4.4),m),X,4.6,-26.5,a+.03,a+.1,0,0,14);return m});
const lamps=[],lights=[];
[-12,-4,4,12].forEach((x,i)=>{const a=.79+i*.02;
 const l=add(new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),new THREE.MeshBasicMaterial({color:0xffdcb0})),x,7.8,-22,a,a+.05,0,8,0);
 const pl=new THREE.PointLight(0xffd9a8,0,26,1.6);pl.position.set(x,7.2,-22);S.add(pl);lights.push(pl)});
const N=500,dp=new Float32Array(N*3);for(let i=0;i<N*3;i+=3){dp[i]=rnd()*40-20;dp[i+1]=rnd()*12;dp[i+2]=rnd()*50-30}
const dust=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(dp,3)),new THREE.PointsMaterial({color:0xffe0b0,size:.06,transparent:true,opacity:.55,depthWrite:false}));S.add(dust);
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();

/* ---------- Interface ---------- */
const T=$('#titles');SCENES.forEach(s=>{s.el=document.createElement('div');s.el.className='sc'+(s.fin?' fin':'');s.el.innerHTML=`<div class="l">${s.l}</div><h2 class="d">${s.t}</h2><p>${s.b}</p>`;T.append(s.el)});
const rail=$('#rail');RAIL.forEach((c,i)=>{const b=document.createElement('button');b.innerHTML=`<u><b></b></u><span>${c[0]}/IV — ${c[1]}</span>`;b.onclick=()=>goto(c[2]+.02);rail.append(b);c.el=b});
const card=$('#card'),cimg=$('#cimg'),ccap=$('#ccap'),btns=$('#btns'),hint=$('#hint');let wi=-1;
const maxS=()=>document.documentElement.scrollHeight-innerHeight;
const goto=p=>scrollTo({top:p*maxS(),behavior:RM?'auto':'smooth'});
$('#logo').onclick=e=>{e.preventDefault();goto(0)};$('#again').onclick=()=>goto(0);
function ui(p){
 SCENES.forEach(s=>s.el.classList.toggle('on',p>=s.r[0]&&p<s.r[1]));
 rail.classList.toggle('on',p>.06&&p<.95);
 RAIL.forEach(c=>{c.el.style.setProperty('--p',clamp((p-c[2])/(c[3]-c[2])).toFixed(3));c.el.classList.toggle('cur',p>=c[2]&&p<c[3])});
 const w=clamp(Math.floor((p-.52)/.08),0,2),on=p>.56&&p<.77;
 card.classList.toggle('on',on);if(on&&w!==wi){wi=w;cimg.src=WORK[w].img;ccap.textContent=WORK[w].c}
 btns.classList.toggle('on',p>.965);hint.style.opacity=p>.02?0:1}

/* ---------- Frame ---------- */
let target=0,cur=0,last=performance.now(),mx=0,my=0,sx=0,sy=0,started=false;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1},{passive:true});
const ease=k=>1-Math.pow(1-k,3);
function frame(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;
 target=maxS()>0?clamp(scrollY/maxS()):0;cur=RM?target:cur+(target-cur)*(1-Math.exp(-dt*3.2));
 const p=cur;sx+=(mx-sx)*.05;sy+=(my-sy)*.05;
 for(const m of parts){const u=m.userData,k=ease(clamp((p-u.a)/(u.b-u.a))),f=1-k;
  m.visible=k>0;m.position.set(u.t[0]+u.o[0]*f,u.t[1]+u.o[1]*f,u.t[2]+u.o[2]*f);m.rotation.set(u.r[0]*f*3,u.r[1]*f*3,u.r[2]*f*2)}
 frames.forEach((m,i)=>{const a=.6+i*.06;m.color.setScalar(clamp((p-a)/.06)*(p>.56&&p<.77?(wi===i?1:.45):.9))});
 const li=clamp((p-.8)/.08);lights.forEach(l=>l.intensity=li*14);
 const fin=clamp((p-.9)/.1),e=ease(clamp(p/.9));
 cam.position.set(sx*1.5*(1-fin),lerp(2.6,3.2,e)+lerp(0,13,fin)-sy*.8*(1-fin),lerp(14,-8,e)+lerp(0,38,fin));
 cam.lookAt(0,lerp(3.4,4.4,e)-fin*2.4,lerp(-26,-26,e)+fin*14);
 const dp=dust.geometry.attributes.position;for(let i=1;i<N*3;i+=3){dp.array[i]+=dt*.12;if(dp.array[i]>12)dp.array[i]=0}dp.needsUpdate=true;
 ui(p);R.render(S,cam)}
R.setAnimationLoop(frame);

/* ---------- Preloader, Enter, sound ---------- */
let shown=0,t0=performance.now(),ready=false;
(function tick(now){const u=clamp((now-t0)/2800);shown+=(u*100-shown)*.08;if(u>=1&&shown>99.5)shown=100;
 const n=Math.floor(shown);$('#cnt').textContent=String(n).padStart(3,'0');$('#st').textContent=n<34?'Ground':n<90?'Structure':'Light';
 $('#fr').style.setProperty('--m',(6+shown*2.1)+'%');
 if(shown>=100&&!ready){ready=true;$('#fr').style.setProperty('--m','300%');setTimeout(()=>$('#pre').classList.add('ready'),700);return}
 requestAnimationFrame(tick)})(performance.now());
let ac,master,on=true;
function sound(){const A=window.AudioContext||window.webkitAudioContext;if(!A||ac)return;ac=new A();master=ac.createGain();master.gain.value=on?.12:0;
 const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=520;f.connect(master);master.connect(ac.destination);
 [55,82.4,110.3,164.9].forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.type=i%2?'sine':'triangle';o.frequency.value=hz;g.gain.value=.25;
  l.frequency.value=.05+i*.03;lg.gain.value=.12;l.connect(lg).connect(g.gain);o.connect(g).connect(f);o.start();l.start()})}
document.querySelectorAll('[data-snd]').forEach(b=>b.onclick=()=>{on=!on;document.querySelectorAll('[data-snd]').forEach(x=>{x.setAttribute('aria-pressed',on);x.querySelector('.sl').textContent=`Sound [${on?'on':'off'}]`});if(master)master.gain.setTargetAtTime(on?.12:0,ac.currentTime,.25)});
$('#enter').onclick=()=>{scrollTo(0,0);$('#pre').classList.add('done');document.body.classList.remove('lock');
 if(RM)$('#veil').style.display='none';else requestAnimationFrame(()=>$('#veil').classList.add('open'));sound()};
if('scrollRestoration'in history)history.scrollRestoration='manual';scrollTo(0,0);
</script></body></html>
